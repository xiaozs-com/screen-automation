name: Publish Skill to ClawHub

on:
  pull_request:
    paths:
      - "skills/screen-automation-engineer/**"
      - "skills/screen-automation/**"
      - "plugins/screen-automation-engineer/**"
      - "tools/assemble_assets.py"
      - "package_assets.ps1"
      - ".clawhubignore"
      - ".github/workflows/clawhub-publish.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.skill-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble and validate Agent assets
        run: python tools/assemble_assets.py --sync --check

      - id: skill-version
        name: Read the asset version
        shell: python
        run: |
          import os
          import json
          import re
          from pathlib import Path

          definition = json.loads(Path("skills/screen-automation-engineer/assembly.json").read_text(encoding="utf-8"))
          version = definition.get("version", "")
          if not re.fullmatch(r"v?\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?", version):
              raise SystemExit(f"assembly version is not SemVer: {version}")
          version = version.removeprefix("v")
          git_ref = os.environ.get("GITHUB_REF", "")
          if git_ref.startswith("refs/tags/") and git_ref != f"refs/tags/v{version}":
              raise SystemExit(
                  f"Tag {git_ref.removeprefix('refs/tags/')} does not match "
                  f"assembly version {version}"
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={version}\n")

  dry-run:
    if: github.event_name == 'pull_request'
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Preview ClawHub release
        run: npx --yes clawhub@0.23.3 skill publish dist/screen-automation-engineer --owner xiaozs-com --slug screen-automation-engineer --version "${{ needs.resolve-version.outputs.version }}" --dry-run

  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assemble and validate ClawHub asset
        run: python tools/assemble_assets.py --sync --check

      - name: Configure ClawHub authentication
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "::error::Missing repository secret CLAWHUB_TOKEN"
            exit 1
          fi
          echo "CLAWHUB_CONFIG_PATH=$RUNNER_TEMP/clawhub-config.json" >> "$GITHUB_ENV"
          npx --yes clawhub@0.23.3 login --token "$CLAWHUB_TOKEN"

      - name: Publish matching ClawHub version
        run: npx --yes clawhub@0.23.3 skill publish dist/screen-automation-engineer --owner xiaozs-com --slug screen-automation-engineer --version "${{ needs.resolve-version.outputs.version }}"
